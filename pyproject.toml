[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-silicon-llm-guide"
version = "1.0.0"
description = "Benchmarks, setup guides, and workarounds for running LLMs on Apple Silicon"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "JD Cordero"},
]
keywords = ["apple-silicon", "llm", "machine-learning", "mlx", "ollama", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Documentation",
]

[project.urls]
Homepage = "https://j3n0v4.github.io/apple-silicon-llm-guide"
Repository = "https://github.com/j3n0v4/apple-silicon-llm-guide"

[project.optional-dependencies]
dev = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-minify-plugin>=0.7.0",
    "pymdown-extensions>=10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = []

[tool.setuptools.package-data]
"*" = ["*.md", "*.yml", "*.yaml"]
